# Threads — mirrored from the canonical-sources matrix where applicable, plus
# I/O-specific threads (capability-matrix-foundation, identify-before-open,
# round-trip-and-export-symmetry, provenance-everywhere, invocation-objects-rollout).
threads:
  - slug: capability-matrix-foundation
    description: "Author the capability matrix (Principle 1) — single registry of (importer/exporter, payload type, dtype, streams, lossless, format) declarations; rebuild dispatchers (importer.py format selection, ExportImages format combo, AddLayerDialog tabs) on top of it."
    cited_cells: []
    cited_io_principles_cells:
      - "src/percell4/domain/io/cross_format.py.1"
      - "src/percell4/domain/io/models.py.1"
      - "src/percell4/adapters/importer.py.1"
      - "src/percell4/adapters/readers.py.1"
      - "src/percell4/store.py.1"
      - "src/percell4/application/use_cases/export_images.py.1"
      - "src/percell4/application/use_cases/add_decay_to_dataset.py.1"
      - "src/percell4/gui/add_layer_dialog.py.1"
      - "src/percell4/gui/export_images_dialog.py.1"
    complexity: large
    rationale: |
      Foundation thread. Eight I/O files violate Principle 1 because no registry names which formats × payload types × directions are supported. Adding a new format (.sdt direct, OME-Zarr) today requires editing dispatch logic in five places. The matrix becomes the test oracle for round-trip (Principle 2) and the lint target for write-boundary discipline (Principle 4). Large because it touches every importer/exporter callsite. Recommend NOT first thread — pick a smaller pain-driven thread to validate the audit shape before this.
    status: proposed

  - slug: identify-before-open
    description: "Promote metadata-first identification: every reader implements identify(path) → confidence + payload type; batch ops identify ALL inputs before any open commits."
    cited_cells: []
    cited_io_principles_cells:
      - "src/percell4/domain/io/discovery.py.3"
      - "src/percell4/domain/io/scanner.py.3"
      - "src/percell4/adapters/importer.py.3"
      - "src/percell4/adapters/readers.py.3"
      - "src/percell4/application/use_cases/add_decay_to_dataset.py.3"
      - "src/percell4/gui/add_layer_dialog.py.3"
      - "src/percell4/gui/compress_dialog.py.3"
    complexity: large
    rationale: |
      Eight cells violate or partially-implement Principle 3. Filename-only discovery is fragile (the user has hit this with TIFF/.bin token mismatches and Dropbox renames). Promoting Identify-before-Open kills the "fails mid-batch at 3am" failure mode. Large because every reader needs an identify() shim and every dispatcher must pre-flight identify. Defer until capability-matrix-foundation lands.
    status: proposed

  - slug: round-trip-and-export-symmetry
    description: "Make export side a peer of the import side. Add /decay export (TIFF stack or .bin), /phasor export, provenance export. Add CI smoke tests parameterized over the capability matrix that round-trip every supported (importer, exporter) pair."
    cited_cells: []
    cited_io_principles_cells:
      - "src/percell4/domain/io/models.py.2"
      - "src/percell4/adapters/importer.py.2"
      - "src/percell4/adapters/readers.py.2"
      - "src/percell4/application/use_cases/export_images.py.2"
      - "src/percell4/gui/export_images_dialog.py.2"
      - "tests/test_io/test_importer.py.2"
    complexity: large
    rationale: |
      Six cells flag asymmetry. /decay and /phasor are write-only; users cannot get them out of the store. This is the "data jail" trap explicitly called out in the ideation doc. Depends on capability-matrix-foundation (need the matrix to declare which round-trips are supported / lossy). Schedule after the foundation thread.
    status: proposed

  - slug: provenance-everywhere
    description: "Extend ProvenanceRecord (currently /decay-only) to /intensity, /labels/, /masks/, /phasor/. Make _write_layer require provenance arg. Sidecar provenance for exports."
    cited_cells: []
    cited_io_principles_cells:
      - "src/percell4/domain/io/models.py.6"
      - "src/percell4/adapters/importer.py.6"
      - "src/percell4/adapters/readers.py.6"
      - "src/percell4/store.py.6"
      - "src/percell4/application/use_cases/export_images.py.6"
      - "src/percell4/gui/export_images_dialog.py.6"
      - "tests/test_io/test_importer.py.6"
      - "tests/test_io/test_readers.py.6"
      - "tests/test_store.py.6"
    complexity: medium
    rationale: |
      Nine cells partial-or-violation. /decay/ provenance is the gold standard (see add_decay_to_dataset.py.6 = ok); replicate to other payloads. Independent of capability-matrix-foundation — can run earlier. Medium because the provenance type already exists; rolling it out is mechanical.
    status: proposed

  - slug: invocation-objects-rollout
    description: "Make every dialog produce a serializable invocation (TOML / Python config). CLI consumes the same invocations. Reproducibility-stack thread."
    cited_cells: []
    cited_io_principles_cells:
      - "src/percell4/gui/import_dialog.py.7"
      - "src/percell4/gui/add_layer_dialog.py.7"
      - "src/percell4/gui/compress_dialog.py.7"
      - "src/percell4/gui/export_images_dialog.py.7"
    complexity: large
    rationale: |
      Four dialogs violate Principle 7 because their output is widget-state, not a serializable invocation. CompressConfig is dataclass-shaped (closest to compliant); others have ad-hoc dict-of-strings. Large because retrofitting four dialogs requires extracting widget→config mapping into builders, plus a CLI front-end. Defer until capability-matrix-foundation lands so the invocations can carry capability-matrix references.
    status: proposed

