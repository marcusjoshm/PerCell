  - slug: overlap-aware-stitching
    solution_doc: docs/solutions/architecture-patterns/overlap-aware-stitching.md
    canonical_file: src/percell4/domain/io/assembler.py
    status: canonical_clean
    notes: "First data-dependent stitch path in domain/io. Geometry (integer per-tile offsets) is computed ONCE at compress via estimate_tile_offsets, persisted via store.write_stitch_geometry, and reused verbatim for every channel and for decay-only append. canvas_from_offsets is the single canvas source; assemble_tiles_with_offsets (intensity) and write_decay_streaming(pixel_offsets=…) (decay) share one (offsets, canvas, ascending-index priority) contract so /decay and /intensity resolve every overlap pixel to the same tile. The byte-identical grid path is preserved behind the gate register ∧ overlap>0 ∧ grid>1×1."
    applies_to:
      - src/percell4/domain/io/assembler.py
      - src/percell4/adapters/importer.py
      - src/percell4/application/use_cases/add_decay_to_dataset.py
      - src/percell4/store.py
  - slug: canonical-stitching-form
    solution_doc: docs/solutions/architecture-patterns/canonical-stitching-form.md
    canonical_file: src/percell4/gui/_stitching_form.py
    status: canonical_clean
    notes: "The ONE widget every tiling surface embeds. Four dialogs previously built their own grid/pattern/order controls and drifted apart (the PR #9 class, recurring even after StitchingFlimForm was documented as canonical — nothing failed when a copy was made). Presentation is separable from the wire format: display labels follow Fiji Grid/Collection Stitching (Pattern, Order, Order options keyed to Pattern) while itemData carries PerCell4's existing canonical strings, which are persisted into .h5 /metadata and run_config.json and must never move. TileConfig.order's eight values are four behaviors under two alias sets, so no domain change was needed to adopt Fiji's vocabulary; _stitch_order.normalize_order maps any accepted value onto its canonical corner when seeding from persisted state. Per-surface variation uses show_registration/show_fusion flags, not subclasses, so exactly one construction site remains."
    applies_to:
      - src/percell4/gui/_stitching_form.py
      - src/percell4/gui/_stitch_order.py
      - src/percell4/gui/_tile_order_preview.py
      - src/percell4/gui/compress_dialog.py
      - src/percell4/gui/add_layer_dialog.py
      - src/percell4/gui/batch_tcspc_dialog.py
      - src/percell4/gui/import_dialog.py

