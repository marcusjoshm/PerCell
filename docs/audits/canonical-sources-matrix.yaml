# ── Gaps surfaced by the audit ─────────────────────────────────────────
gaps:
  - slug: dialog-scroll-when-tall
    reason: "No solution doc existed; the user has had to instruct the QScrollArea-wrap-+-screen-cap pattern repeatedly throughout PerCell's lifetime (Thread 1 commit 6adde5a re-instructed it for add-layer TCSPC)."
    authored_by_audit: docs/solutions/ui-bugs/dialog-scroll-when-tall.md
  - slug: decay-write-path
    reason: "Thread 1 produced the canonical write_decay_streaming + append_decay_layers but no docs/solutions/ entry named the canonical source; the 5 alignment commits (e25831a/37dd603/392f66d/f31a970/c25950e) document what NOT to do but not WHERE the canonical lives."
    authored_by_audit: docs/solutions/architecture-patterns/decay-write-path.md
  - slug: channel-deletion-permanence
    reason: "Thread 1 surfaced the bug, but no solution doc named the 7-step convention or proposed promoting the orchestration to a use case."
    authored_by_audit: docs/solutions/architecture-patterns/channel-deletion-permanence.md
  - slug: atomic-write-contract
    reason: "Pattern referenced across store/project/workflows but never named as a single-source-of-truth convention."
    authored_by_audit: docs/solutions/architecture-patterns/atomic-write-contract.md
  - slug: cross-format-token-matching
    reason: "Pure-domain canonical exists at domain/io/cross_format.py but no docs/solutions/ entry frames it as a reusable boundary; would be useful for future format additions (.sdt → channel binding)."
    authored_by_audit: null
    note: "Not authored in this pass because the canonical is clean and consumed by both callsites; can be authored as a follow-up if a third callsite emerges."
  - slug: overlap-aware-stitching
    reason: "The overlap-aware registered stitch path (feat/mosaic-merge-overlap-stitching, U1–U7) introduced the first data-dependent canvas in domain/io. The register-once-at-compress + persist + reuse-verbatim architecture, the canvas_from_offsets single-source rule, the offsets-as-dataset + /provenance/stitch convention, and the byte-identical gate had no docs/solutions/ entry naming the canonical source or the cross-layer alignment invariant."
    authored_by_audit: docs/solutions/architecture-patterns/overlap-aware-stitching.md

# ── Threads ────────────────────────────────────────────────────────────
threads:
  - slug: dialog-scroll-helper-rollout
    description: "Promote the QScrollArea-wrap + screen-bound-resize pattern into a shared gui helper; converge all dialogs onto it; cover with a test."
    cited_cells:
      - "src/percell4/gui/import_dialog.py.dialog-scroll-when-tall"
      - "src/percell4/gui/add_layer_dialog.py.dialog-scroll-when-tall"
      - "src/percell4/gui/compress_dialog.py.dialog-scroll-when-tall"
      - "src/percell4/gui/export_images_dialog.py.dialog-scroll-when-tall"
      - "src/percell4/gui/workflows/single_cell/config_dialog.py.dialog-scroll-when-tall"
      - "tests/test_gui_workflows/test_config_dialog.py.dialog-scroll-when-tall"
    cited_io_principles_cells: []
    complexity: small
    rationale: |
      Five dialogs implement a re-implements/drift variant of the same pattern; one (export_images_dialog) drifts (no wrapper at all). The user has named this as repeat-instruction pain across the project's lifetime. Authoring the canonical helper + migrating five callsites is a single small thread (~4-6 commits). Closes one whole canonical-source column at once. Acceptance: every *Dialog.py either uses the helper or has a documented exemption test fixture.
    status: closed

  - slug: append-flow-plan-consumption
    description: "Make add_decay_to_dataset accept a pre-discovered bin list (DiscoveredFile / explicit Path list) instead of an rglob source_dir; align the dialog to pass that plan; fix the third occurrence of the discovery-scopes-processing-consumes pattern."
    cited_cells:
      - "src/percell4/application/use_cases/add_decay_to_dataset.py.discovery-scopes-processing-consumes"
      - "src/percell4/gui/add_layer_dialog.py.discovery-scopes-processing-consumes"
      - "tests/test_add_decay_to_dataset.py.discovery-scopes-processing-consumes"
    cited_io_principles_cells:
      - "src/percell4/application/use_cases/add_decay_to_dataset.py.5"
    complexity: medium
    rationale: |
      Third occurrence of the bug pattern documented in batch-compress-development-lessons.md and add-layer-flat-discovery-duplicate-import.md. Use case currently does `source_dir.rglob("*.bin")` at the consumption layer — same shape as the two prior occurrences. Affects only the append flow today (single-bin-per-channel is fine), but a Reference/Consolidate refactor or a multi-source append would re-trip the bug. Aligns with I/O Principle 5 (one pipeline; batch ≡ incremental). Coherent thread that closes the third recurrence definitively.
    status: proposed

  - slug: write-boundary-discipline
    description: "Eliminate direct `h5py.File(...)` / `os.replace`-bypass / tifffile.imwrite-direct in use cases and dialogs. All HDF5 mutation goes through DatasetStore methods; all TIFF export goes through an atomic-write helper."
    cited_cells:
      - "src/percell4/application/use_cases/add_decay_to_dataset.py.atomic-write-contract"
      - "src/percell4/gui/add_layer_dialog.py.atomic-write-contract"
      - "src/percell4/application/use_cases/export_images.py.atomic-write-contract"
      - "src/percell4/adapters/importer.py.atomic-write-contract"
      - "src/percell4/adapters/importer.py.decay-write-path"
    cited_io_principles_cells:
      - "src/percell4/application/use_cases/add_decay_to_dataset.py.4"
      - "src/percell4/gui/add_layer_dialog.py.4"
      - "src/percell4/application/use_cases/export_images.py.4"
      - "src/percell4/adapters/importer.py.4"
    complexity: medium
    rationale: |
      Five callsites bypass the centralized write boundary. `add_decay_to_dataset` reaches into h5py for rotate/flip/provenance; `add_layer_dialog._tcspc_write_bin_intensity_debug_layers` opens h5py directly; `export_images` writes TIFFs without atomic replace; `importer.import_dataset` calls `store.create()` (per-op write) instead of `create_atomic`. Closes both reuse-axis cells AND I/O Principle 4 cells in one go. Also retires the importer dead-code duplicate.
    status: proposed

  - slug: post-append-session-events
    description: "Introduce per-state events for metadata-mutated and decay-layers-added so peer views can drop stale caches without coarse DATASET_CHANGED. Eliminates the manual handle.metadata.update(attrs) workaround inside add_layer_dialog._tcspc_persist_flim_metadata."
    cited_cells:
      - "src/percell4/gui/add_layer_dialog.py.session-state-event-emission"
    cited_io_principles_cells: []
    complexity: small
    rationale: |
      Vector 3 of the staleness compound is solved today by mutating `handle.metadata` in-place from the dialog. That works but bypasses the event system — a use case run from the CLI couldn't emit the same in-process update. Promoting to METADATA_CHANGED / DECAY_LAYERS_CHANGED events plus a CellDataModel forwarding bridge makes the fix mechanical and CLI-reachable. Small thread; pre-requisite for retiring the manual snapshot-mutation pattern.
    status: proposed

  - slug: cleanup-decay-write-deadcode
    description: "Remove the unreachable inline-h5py decay-write block in adapters/importer.py:462-504 and the dead _read_and_stitch_decay helper in add_decay_to_dataset.py:407-471."
    cited_cells:
      - "src/percell4/adapters/importer.py.decay-write-path"
    cited_io_principles_cells: []
    complexity: small
    rationale: |
      Pure cleanup — both blocks are dead code left behind by Thread 1's consolidation. Trivial PR; reduces matrix surface area; removes future risk of someone "fixing" the dead code path and re-introducing the divergence Thread 1 closed.
    status: proposed

  - slug: import-atomicity-converge
    description: "Make initial import use DatasetStore.create_atomic so a crashed import doesn't leave a partial .h5 visible. Also lifts the per-op `store.create()` to the canonical helper."
    cited_cells:
      - "src/percell4/adapters/importer.py.atomic-write-contract"
    cited_io_principles_cells:
      - "src/percell4/adapters/importer.py.4"
    complexity: medium
    rationale: |
      The atomic-write helper exists (store.create_atomic) but the initial import path doesn't use it. Refactoring import_dataset to build under a temp .h5 and os.replace at the end requires threading the store handle through the channel/decay write phases — non-trivial because decay streaming writes incrementally. Alternative: keep per-op writes but add a "completion" sentinel (`/metadata.attrs[import_complete]`) that downstream readers check. User picks which approach. Could be merged into write-boundary-discipline thread.
    status: proposed
