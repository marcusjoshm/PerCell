      active_channel only indirectly, via _get_image_shape, to size the circle.
      Three triggers converge on the idempotent remove-before-add
      _sync_diameter_circle: this checkbox, CellposeSettingsForm.diameter_changed,
      and the state_changed.data branch (deferred one tick, same reason as
      _wire_paint_autosave). Diameter (px) == 0 is auto-detect and draws
      nothing. The handler restores viewer.layers.selection.active around the
      add so the overlay cannot steal the active Labels layer.

