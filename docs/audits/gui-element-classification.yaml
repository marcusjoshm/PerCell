    notes: >-
      Toggles the `_cellpose_preview` napari Image layer — the active channel
      after the same Saturation LUT and Gaussian blur Run Cellpose applies, so
      the user can tune those two fields by eye. Action, not Creator: it adds a
      napari layer but writes no session selection field and no dataset
      resource; the layer is transient and never persisted to the .h5. Side
      effect on the viewer: the raw channel layer is hidden while the preview
      is shown and its prior visibility restored (by layer object, only if
      still present and still hidden) on untick, channel switch, preview
      removal, and rebuild. Every trigger — this checkbox,
      CellposeSettingsForm.saturation_changed / blur_sigma_changed, the
      state_changed channel / timepoint / data / bin branches, and the viewer's
      layers.events.removed / inserted — converges on the idempotent
      _sync_cellpose_preview, debounced through one single-shot timer except
      for the explicit toggle. Both fields at 0 is identity and draws nothing.
      Restores viewer.layers.selection.active around the add so the overlay
      cannot steal the active Labels layer.

