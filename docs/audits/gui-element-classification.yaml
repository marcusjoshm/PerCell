# 2026-08-20 update (feat/cellpose-preprocess-preview U5):
#   +1 widget: segmentation_panel.cellpose_preview_preprocess_checkbox => ACTION.
#   Toggles a `_cellpose_preview` Image layer showing the active channel after
#   the Saturation LUT and Gaussian blur that Run Cellpose applies (the shared
#   domain helper preprocess_cellpose_input). Adds a napari layer but writes no
#   session field and no dataset resource — transient, never persisted — so it
#   is an Action, not a Creator. Notable side effect, kept exhaustive: while the
#   preview is shown the active channel's raw Image layer is hidden (prior
#   visibility remembered by layer object), and that visibility is restored on
#   untick, channel switch, preview removal, and rebuild — only if the same
#   layer object is still present and still hidden, so a layer the user
#   re-showed by hand is left alone. Reads active_channel and active_timepoint
#   (the time-lapse preview is the displayed frame only). Captures and restores
#   viewer.layers.selection.active around the add, like the diameter circle.
#   No new Action writers of session fields.
# 2026-07-28 update (refactor/canonical-stitching-form U8):
#   Collapses 13 per-surface stitching widget entries (compress.stitch_*,
#   add_layer.batch_tab.stitch_*, add_layer.tcspc_tab.stitch_*,
#   batch_tcspc.stitching.*) into 9 canonical stitching_form.* entries, because
#   all four surfaces now embed ONE StitchingForm. The host-owned enable
#   checkboxes stay with their own surfaces.
#   Net -13 +9. CLASSIFICATION IS UNCHANGED: every stitching control was and
#   remains an Action — a pre-run configuration operand touching no Session
#   selection field. The consolidation moved code, not contracts.
#   Also ADDS entries that were never recorded at all: overlap, register,
#   reference and fusion (compress had none of them), plus the new read-only
#   order-preview widget.
#   NOTE: total_widgets/counts were already stale before this pass — the header
#   read 208/16/17/175 while the file actually held 215 widgets. Corrected here
#   to the real figures rather than adjusted by the delta.
# 2026-07-23 update (feat/cellpose-diameter-reference-circle U3):
#   +1 widget: segmentation_panel.cellpose_diameter_circle_checkbox => ACTION.
#   Toggles a magenta `_diameter_reference` Shapes layer sized to the Cellpose
#   Diameter (px) field. It adds a napari layer but writes no session field and
#   no dataset resource — a transient display overlay, never persisted to the
#   .h5 — so it is an Action, not a Creator. Notable interaction: the handler
#   captures and restores viewer.layers.selection.active around the add,
#   because napari activates every newly added layer and would otherwise pull
#   selection off the user's Labels layer (which also disarms the `M`
#   multi-select keystroke bound on Labels keymaps). That restore keeps the
#   widget's contract exhaustive — it leaves layer selection exactly as it
#   found it.
#   No new Action writers of session fields.
# 2026-05-21 update (feat/time-lapse-tracking-lineage U4, U10):
#   Adds a sixth session selection field, active_timepoint, and two new
#   classified GUI elements:
#     - ViewerWindow timepoint dims slider (napari dims.events.current_step)
#       => SELECTOR. It is the sole writer of session.active_timepoint. This
#       is a dims event, NOT a layer-list-selection event, so it does not
#       violate the "napari -> session forbidden for layer-list events" rule.
#       Guarded by a dedicated _timepoint_originator flag (separate from
#       _is_originator) so it cannot collide with selection/active-layer
#       pushes. session -> napari is the one-way push in
#       ViewerWindow._push_timepoint_to_napari.
#     - segmentation_panel "Track Cells Across Timepoints" button => CREATOR.
#       Runs TrackCells, which writes /labels/<seg>_tracked + /tracks/<seg>,
#       refreshes the segmentation inventory, and set_active_segmentation()s
#       the tracked resource (Creator four-step; viewer add done by the panel).
#   No new Action writers of session fields.
# 2026-05-13 update (feat/session-selection-window):
#   Retires the per-panel channel-override pattern (PR #11 era) and the
#   three Data-tab Selector combos in favor of a single canonical
#   SessionWindow at src/percell4/interfaces/gui/peer_views/session_window.py.
#   Net widget change: -1 (remove grouped_seg_panel.channel_combo Action;
#   data_panel removes 3 Selectors; SessionWindow adds 3 Selectors).
#   Resolves audit OQ-3: there are no per-module Selectors for
#   active_channel / active_segmentation / active_mask; the SessionWindow
#   is the sole non-Data-tab Selector site and the Data tab no longer
#   contains Selectors at all.
# 2026-05-12 update (feat/batch-tcspc-append U5):
#   +13 widgets on the new Batch TCSPC Append surface:
#     io_panel.batch_tcspc_append_button (Action — launcher entry).
#     batch_tcspc.* (12 dialog widgets) — every internal control is Action
#       except batch_tcspc.run_button, which is Creator (writes /decay/<ch>
#       and flat FLIM calibration keys to /metadata for each paired .h5).
#   No new Selectors. The dialog never writes session.active_* / filter_ids /
#   selection: it operates on user-picked .h5 files, not the active session.
#   After each successful item, the dialog defensively syncs
#   session.dataset.metadata in place IFF the active session points at the
#   same .h5 path (h5py library-cache staleness defense).
# 2026-05-03 update (feat/phasor-gmm-segmentation U7):
#   +14 Actions on the FlimPanel and PhasorPlotWindow surfaces:
#     FlimPanel: intensity_threshold_spin, ref_circle_check, ref_circle_tau_spin,
#                ref_circle_radius_spin, shape_combo, auto_check, n_clusters_spin,
#                criterion_combo, cov_f_spin, shift_spin, run_gmm_button (11)
#     PhasorPlotWindow: selected_cov_f_spin, selected_shift_spin,
#                       selected_reset_to_fit_button (3)
#   No new Selectors or Creators. The downstream Apply ROIs as Masks remains
#   the existing Creator that writes /masks/<roi_name> when GMM-origin ROIs are
#   committed.
# 2026-06-08 update (feat/existing-mask-reuse-and-threshold-clis U3):
#   WorkflowConfigDialog gains a "Use existing masks (skip thresholding
#   rounds)" checkable group with a per-dataset multi-select mask picker
#   (_build_mask_selection_group / _refresh_mask_picker /
#   existing_mask_selections). Like the existing per-dataset segmentation
#   combos in the same dialog, these are PRE-RUN CONFIG controls, NOT
#   session Selectors/Creators/Actions: the dialog runs around a batch run
#   and writes only dialog-local state (later folded into the frozen
#   WorkflowConfig). It never touches session.active_* / filter_ids /
#   selection. No new Selectors, Creators, or session mutations.
# 2026-07-24 update (feat/batch-tools-dedicated-window U2):
#   Batch Tools moved from an inline stacked-content console to a dedicated
#   top-level window (peer_views/batch_tools_window.py). The sidebar page is now
#   BatchToolsPanel with two Action buttons (open_button, hide_button); selecting
#   the Batch Tools tab also auto-opens that window via
#   main_window._on_sidebar_click (navigation Action — reads/writes no session
#   field). The relocated BatchConsolePanel stays Action-class (writes none of
#   the five session fields). No new Selectors, Creators, or session mutations.

# Three-class taxonomy:
#   Selector — reads session, writes session selection fields, no resource write
#   Creator  — reads session, writes new resources, auto-selects via session write
#   Action   — reads session, no session selection write, no resource write
#
# Session selection fields tracked in I1: active_channel, active_segmentation,
# active_mask, filter_ids, selection.
#
# U1 covers the canonical hexagonal tree
# (src/percell4/interfaces/gui/task_panels and peer_views).
# U2 extends with the legacy src/percell4/gui/ tree, plus
# `gui/viewer.py` napari callback registrations (no bind_key entries today;
# canvas-click selected_label forwarding is the sole Selector for `selection`
# under OQ-1) and an out-of-tree entry for the
# `interfaces/gui/main_window.py:594-605` `events.active` closure that surfaces
# in U3's mutation graph and is removed in U9.

