    notes: >-
      Toggles the `_diameter_reference` napari Shapes layer — a magenta disc at
      the image's bottom-left whose diameter equals the Cellpose Diameter (px)
      field, for sizing that value against real cells. Action, not Creator: it
      adds a napari layer but writes no session selection field and no dataset
