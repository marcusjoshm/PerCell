name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: python -m pip install "ruff>=0.4"
      - name: ruff check
        run: ruff check src tests tests_gui

  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the package version is derived from git tags by
      # setuptools-scm, and a shallow checkout would install a wrong version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Qt/X11 runtime libraries required by PyQt5 + napari under a virtual
      # framebuffer (the headless pattern documented in the README).
      - name: Install Qt/X11 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-cursor0
      # Install the CPU-only torch + torchvision wheels first so cellpose does
      # not pull the multi-gigabyte CUDA build on a runner with no GPU. torch
      # and torchvision must come from the same index or torchvision's compiled
      # ops (e.g. torchvision::nms) fail to register against the torch build.
      - name: Install CPU-only torch + torchvision
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install percell4 + test dependencies
        run: python -m pip install -e ".[flim,imagej]" pytest pytest-qt pytest-cov
      # A bare `pytest`, deliberately. Every part of the selection lives in
      # pyproject.toml's addopts, so this job and a local run choose the same
      # tests and a local green means a CI green.
      #
      # It used to pass `-m 'not slow and not gui'` here, and that is what made
      # CI untrustworthy: a command-line -m overrides addopts, so CI silently
      # ran a *larger* suite than any local run — including 100 napari-viewer
      # tests deselected locally — while the `gui` half of the expression
      # matched zero tests and excluded nothing at all.
      #
      # No xvfb: tests/conftest.py selects QT_QPA_PLATFORM=offscreen, so there
      # is no display to virtualize. The GL suite that does need one runs in
      # the gui-tests job below.
      - name: Run tests
        env:
          QT_API: pyqt5
        run: pytest

  gui-tests:
    name: GUI tests (real OpenGL)
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the package version is derived from git tags by
      # setuptools-scm, and a shallow checkout would install a wrong version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt/X11 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-cursor0
      - name: Install CPU-only torch + torchvision
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install percell4 + test dependencies
        run: python -m pip install -e ".[flim,imagej]" pytest pytest-qt pytest-cov
      # tests_gui/ builds real napari viewers, so it needs a real GL context and
      # cannot use the offscreen platform the main suite runs under. xvfb's
      # software GL is what makes these reliable here; on a machine with a real
      # GPU they are not, which is why they are CI-only.
      #
      # These are the only automated coverage of the napari integration
      # contract, so the job runs on every PR. `main` has no branch protection,
      # here as elsewhere in this repo, so a failure surfaces as a red check
      # rather than blocking a merge — same as it did before the tests/ vs
      # tests_gui/ split, when these tests failed inside the main test job.
      #
      # If this job ever starts flaking *on CI* (a real GPU is a different
      # story — see above), fix it or drop it. A check that cries wolf is how
      # the whole suite stopped being trusted in the first place.
      #
      # napari/vispy can abort with a core dump during interpreter teardown,
      # after the session has already reported its result. os._exit on pytest's
      # return code skips the crashy GL/atexit finalizers.
      - name: Run GUI tests
        env:
          QT_API: pyqt5
        run: |
          xvfb-run -a python -c "import sys, pytest; \
          code = pytest.main(['tests_gui']); \
          sys.stdout.flush(); sys.stderr.flush(); \
          import os; os._exit(code)"
